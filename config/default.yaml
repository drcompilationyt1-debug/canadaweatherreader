models_dir: models

data:
  # Daily bars from Yahoo Finance (free, no key) cached as parquet under cache_dir.  A cached
  # ticker is re-downloaded automatically when it is older than refresh_days, so every
  # `trade` / `retrain` / `fetch-data` run works on fresh data.
  start: "2008-01-01"
  end: null              # null = today
  interval: "1d"
  cache_dir: data/cache
  # Everything after train_end is held-out test data.  "rolling:12" = the first day of the month 12
  # months ago, so the paper-trading months become training data a year later while the last year
  # stays a real out-of-sample check (a fixed date such as "2022-12-31" also works).
  train_end: "rolling:12"
  refresh_days: 1

signals:
  # Tier A - native, always available ------------------------------------------------
  technical:     { enabled: true }
  candles:       { enabled: true, horizons: [1, 5, 20], decay: [1.0, 0.6, 0.3] }     # 19 hand-coded patterns + stats
  trend:         { enabled: true }
  alpha_factors: { enabled: true, horizon: 5, min_train_years: 3, refit_every: 1 }   # qlib-lite factor model
  market_regime: { enabled: true, window: 252 }                                        # FinRL-style turbulence
  # Tier B - optional, auto-enabled when the dependency / key is present -------------
  talib_candles: { enabled: true, horizons: [1, 5, 20], decay: [1.0, 0.6, 0.3] }     # TA-Lib's 61 recognisers
  trendet:       { enabled: true }
  sentiment:     { enabled: true, lookback_days: 3 }                     # VADER (stocksight-style)
  # score_history: let the LLM score past headlines (one call per week per ticker, resumable, capped
  # per run by max_history_calls) so the block has a training history - needs data/news/*.csv
  # rag_grading: retrieve -> grade relevance -> generate (stocks-insights-ai-agent's news graph), one extra call
  news_llm:      { enabled: true, lookback_days: 3, max_items: 25, score_history: false, max_history_calls: 200, history_granularity: week, rag_grading: false }
  qlib:          { enabled: true, predictions: models/qlib/pred.parquet, max_age_bars: 5 }   # rebuilt every morning before the session (session.yml); the last score is kept up to 5 bars if that fails
  qlib_tra:      { enabled: true, predictions: models/qlib/pred_tra.parquet, max_age_bars: 7 }   # qlib's TRA (Lin et al. 2021), trained on the weekend by scripts/qlib_train.py --model tra
  freqtrade:     { enabled: true }
  # Tier C - LLM multi-agent frameworks (a dozen LLM calls per ticker).  They run in their own
  # virtualenvs (python scripts/setup_agent_envs.py; python: null = auto-detect) and only on the
  # `agents.top_n` tickers where the other models agree most (strongest |consensus|), within
  # `agents.budget_minutes` per cycle; the session pre-computes them before the open so the
  # orders at 09:35 are not delayed.  Results are cached per (ticker, bar date).
  agents: { top_n: 4, budget_minutes: 25, max_failures: 2 }   # a framework failing twice in a row is skipped for the rest of the run
  compute_workers: 3          # per-ticker blocks computed in this many threads at the live cycle (torch / TF blocks run one at a time)
  # TradingAgents on Gemini (llm_provider google uses the GEMINI_API_KEY pool as GOOGLE_API_KEY).  One run is
  # ~30 LLM calls with long prompts plus Reddit look-ups that back off on 429s: 5-10 minutes per ticker.
  # Groq's free tier (8K tokens/min on gpt-oss-120b) throttled it past the timeout; an OpenAI-compatible
  # backend_url containing "groq" / "openrouter" / "generativelanguage" picks the matching key pool.
  trading_agents: { enabled: true, python: null, llm_provider: google, backend_url: null,
                    deep_think_llm: gemini-3.8-flash, quick_think_llm: gemini-3.5-flash-lite, max_debate_rounds: 1, timeout: 900,
                    deep_think_fallbacks: [gemini-3.5-flash, gemini-2.5-flash], quick_think_fallbacks: [gemini-2.5-flash-lite, gemini-2.5-flash] }
  # ai-hedge-fund on Gemini flash (registered at runtime by our runner script) with free Yahoo data; GEMINI_API_KEY pool.
  ai_hedge_fund:  { enabled: true, python: null, mandate: null, llm_model: gemini-3.8-flash, data: yfinance, timeout: 600,
                    llm_fallbacks: [gemini-3.5-flash, gemini-2.5-flash] }   # each model is probed first; a 503 costs seconds, not minutes
  # Ports of the reference repos (Lean algorithms, huseinzol05 agents, akurgat indications,
  # the LSTM-style forecasters) - cheap extra opinions for the policy ------------------
  strategy_zoo:  { enabled: true }
  # es_agent / dqn_agent are fitted on bars ending `holdout_years` before data.train_end and their
  # outputs over their own fit window are masked, so the policy only ever sees them out of sample
  es_agent:      { enabled: true, window_size: 20, layer_size: 64, iterations: 100, train_bars: 1500, holdout_years: 4 }
  dl_forecast:   { enabled: true, window: 30, horizon: 5, hidden: 32, epochs: 3, min_train_years: 3, refit_every: 2 }
  dqn_agent:     { enabled: true, look_back: 15, episodes: 12, train_bars: 1000, hidden: 32, holdout_years: 4 }   # AI-Stock-Trader + stockBot port
  llm_trader:    { enabled: true, top_n: 12, budget_minutes: 12 }   # nofx-style LLM decision (live): about a minute per name, so only the held
                                                                    # names + the top_n consensus names, within the budget (top_n 0 = every name)
  ta_keras:      { enabled: true, python: null, timeout: 900, latest_bars: 400 }                 # akurgat's Keras models (needs .venv-tf)
  # Added 2026-09-13 - seven more third-party inputs, all CPU-only, cached under models/signals/<name>:
  pandas_ta:     { enabled: true }                                                              # pandas-ta-classic: 12 indicators the native block lacks
  pypfopt:       { enabled: true, window: 252, refit_every: 21 }                                # PyPortfolioOpt: HRP / inverse-vol weights, corr to market
  alpha101:      { enabled: true }                                                              # WorldQuant 101 alphas (12 of them, cross-sectional ranks)
  finbert:       { enabled: true, model: ProsusAI/finbert, lookback_days: 3, max_texts: 1200 } # FinBERT headline sentiment; ~36 headlines/s on a CPU, newest scored first, cache grows weekly
  chronos:       { enabled: true, model: amazon/chronos-bolt-small, context: 256, batch_size: 64, history_years: 0, stride: 1 }   # zero-shot foundation forecaster
  chronos2:      { enabled: true, model: amazon/chronos-2, context: 256, batch_size: 16, history_years: 6, stride: 5, benchmark: SPY }   # Chronos-2 with volume + index covariates (every 5th bar of the last 6 years; own cache)
  kronos:        { enabled: true, model: NeoQuasar/Kronos-small, context: 400, pred_len: 5, batch_size: 16, temperature: 0.8, history_years: 5, stride: 10 }   # K-line foundation model (small: 0.4 s/forecast on a CPU)
  timesfm:       { enabled: true, model: google/timesfm-2.5-200m-pytorch, context: 512, batch_size: 32, history_years: 6, stride: 5 }      # Google TimesFM
  fundamentals:  { enabled: true, lag_days: 60, refresh_days: 7 }                                # value / growth / profitability / leverage / size from Yahoo statements (point-in-time)
  factors:       { enabled: true }                                                                # 12-1 momentum, reversal, 52-week high, dollar volume, idio vol, beta, sector-relative 3m (percentiles across the universe, daily)
  xs_rank:       { enabled: true, horizon: 20, min_train_years: 3, refit_every: 1, n_estimators: 300 }   # cross-sectional ranking head (LightGBM on all blocks above, walk-forward)
  xs_nn:         { enabled: true, horizon: 20, min_train_years: 3, refit_every: 1, hidden: [64, 32], max_iter: 60, max_train_rows: 150000 }   # the same ranking by a 2-layer network (Gu-Kelly-Xiu): a second opinion the blend tuner can weight
  xs_tabpfn:     { enabled: true, horizon: 20, min_train_years: 3, refit_every: 1, max_train_rows: 4000, chunk: 2000, years_back: 2, stride: 5 }   # TabPFN ranker: a 4000-row context, the last 2 years, every 5th day (CPU ~50 ms a row); needs TABPFN_TOKEN
  # block pruning (weekly, models/block_mask.json): a block whose every feature has |t| < mask_t on its 6-month cross-sectional IC and
  # that carries < mask_gain of the ranking head's gain is masked (flag 0, features 0 - the layout and the models stay valid) until it
  # recovers past unmask_t / unmask_gain; the core price blocks, the ranking head and the reliability board are never masked
  pruning:       { enabled: true, days: 126, mask_t: 1.0, mask_gain: 0.01, unmask_t: 1.5, unmask_gain: 0.02, min_names: 15,
                   protect: [qlib] }   # protect: blocks that stay in whatever the evidence (qlib runs every day by design)
  reliability:   { enabled: true, horizon: 5, window: 60, min_obs: 10 }                          # trailing hit rate of every input at 5 days (signal-decay monitor), last in the layout

fees:
  # The broker's real fee schedule, charged in the simulator, by the built-in paper broker and -
  # virtually - on Alpaca's free paper account, so the policy learns with the costs it will pay
  # at moomoo.  moomoo = per-share commission + platform fee with per-order minimums (Canada /
  # international schedule, the most expensive); moomoo_us = commission-free (regulatory fees only);
  # moomoo_intl = flat $0.99 per order; bps = the old proportional env.commission; none.
  # Verified against moomoo.com/ca/pricing on 2026-09-15: US stocks US$0.0049/sh min $0.99 + platform US$0.005/sh min $1 (US$1.99
  # per trade at least), no FX fee; Canadian stocks CA$0.0049/sh min $0.49 + platform CA$0.01/sh min $1.  Margin account: needs
  # US$2,000 / CA$2,500 to qualify, shorting allowed, interest 6.75% USD / 4.45% CAD - none of which the bot uses: it buys with
  # its own cash only (execution.cash_reserve keeps 10% of equity untouched), never shorts, never borrows.
  preset: moomoo
  by_market: { ca: moomoo_ca }   # Canadian stocks: C$0.0049/sh min C$0.49 + platform C$0.01/sh min C$1.00 (moomoo Canada)
  max_cost_bps: 25          # an order whose fixed minimums exceed this share of its value is not placed
  # overrides (USD): commission_per_share, commission_min, platform_per_share, platform_min, per_order,
  # sec_fee_rate, finra_taf_per_share, fractional_pct, fractional_max

env:
  episode_length: 252
  warmup: 260               # bars of history needed before the first observation
  initial_cash: 100000
  cash_range: [10000, 100000]    # every training episode starts with a random budget between these (log-uniform): the simulator
                                 # covers everything from the $10k book to the $100k one; with the fee_drag feature the policy
  cash_choices: null             # learns what each budget can afford (alternative: a fixed list of budgets to pick from)
  fee_choices: [moomoo, webull]  # the broker's fee schedule is drawn per episode too (moomoo Canada vs commission-free Webull), so
                                 # the fee_drag input spans both and the same policy can run at either broker (fees.preset per account)
  commission: 0.0005        # 5 bps per side - only used with fees.preset: bps; otherwise the simulator charges the
                            # fees.preset schedule as if one position were execution.max_position of real equity
  slippage: 0.0005          # 5 bps per side
  # Shorting single large caps lost money on every name where the policy used it in the 2023-2026
  # evaluation, so it is off by default; --set env.allow_short=true re-enables it (with the penalty).
  allow_short: false
  max_leverage: 1.0         # |exposure| <= 1
  short_borrow_rate_annual: 0.03
  short_penalty: 0.05       # extra reward penalty per unit of short exposure per day (x reward_scale)
  turnover_penalty: 0.3     # reward penalty per unit of exposure traded (churn costs money)
  reward: log_return        # log_return | excess_log_return
  benchmark_mix: 1.0        # 0..1  subtract this fraction of buy-and-hold log return: the reward is excess return over
                            # the stock itself, so "match the market, deviate only with conviction" is the default behaviour
  vol_target: 0.35          # annualised volatility a full-conviction position is sized to (0 = plain exposure)
  vol_window: 20
  vol_max_scale: 1.5        # never scale a position up by more than this
  variance_penalty: 0.0
  drawdown_penalty: 0.0
  reward_scale: 100.0
  signal_dropout: 0.15      # prob. that a signal block is hidden for a whole episode (robustness)
  deadband: 0.10            # |target - current| below this -> no trade
  blowup_equity_frac: 0.3   # episode ends if equity drops below this fraction

train:
  algo: ppo                 # ppo | sac
  total_timesteps: 1000000
  seeds: 3                  # independent policies whose actions are averaged (ensemble); 1 = single policy
  ensemble_min_score: 0.0   # members whose best out-of-sample score is below this are left out (best one always kept)
  eval_bars: 750            # bars of held-out data used by the periodic evaluation
  n_envs: 8
  vec_env: auto             # auto | dummy | subproc
  seed: 0
  device: cpu               # cpu is usually faster for MLP policies; use cuda for large nets
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.001
  clip_range: 0.2
  net_arch: [256, 256]
  checkpoint_dir: models/policy
  eval_freq: 20000
  eval_tickers: 12          # tickers used for the periodic out-of-sample evaluation / checkpoint selection
  eval_cash: [10000, 100000]  # every evaluation window is run at both paper budgets; the score averages the two books
  recent_bias: 0.0          # prob. that an episode starts inside the last `recent_days` of history
  recent_days: 400

llm:
  # Backends are tried in this order; the first that answers wins, the rest are fallbacks.
  # Free options first:
  #   openrouter - free models (":free" suffix)  https://openrouter.ai/models?q=free   OPENROUTER_API_KEY
  #   groq       - free tier                     https://console.groq.com               GROQ_API_KEY
  #   gemini     - Google AI Studio free tier    https://aistudio.google.com            GEMINI_API_KEY
  #   ollama     - local models, no key          https://ollama.com
  #   anthropic  - Claude, paid, best quality                                           ANTHROPIC_API_KEY
  #   openai     - OpenAI, or any OpenAI-compatible server via base_url                 OPENAI_API_KEY
  order: [openrouter, groq, gemini, ollama, anthropic, openai]
  cooldown_seconds: 3600                  # default rest after a quota / rate-limit error
  state_file: data/llm_state.json
  openrouter:
    # Free roster as of 2026-09-12 (it changes; check https://openrouter.ai/collections/free-models):
    # ling-3.0-flash-fin is a 124B MoE tuned for finance, the Nemotron 3 models are the strongest
    # general free reasoners, openrouter/free auto-routes to whatever free model is available.
    model: inclusionai/ling-3.0-flash-fin:free
    fallback_models: [nvidia/nemotron-3-super-120b-a12b:free, nvidia/nemotron-3-ultra-550b-a55b:free, openrouter/free]
    cooldown_seconds: 900                 # free models: 20 req/min, 50 req/day (1000/day once $10 of credits were ever bought)
    max_tokens: 1024
  # Every provider takes several keys (NAME, NAME_2.., or NAMES comma-separated): they are used in
  # turn and a key that hits its daily cap rests while the others continue.
  groq:
    # Groq roster as of 2026-09-12: gpt-oss-120b is the strongest reasoner (30 req/min, 1000/day per
    # account), qwen3.8-27b and gpt-oss-20b are the fallbacks (llama-3.3-70b was retired).
    model: openai/gpt-oss-120b
    fallback_models: [qwen/qwen3.8-27b, openai/gpt-oss-20b]
    cooldown_seconds: 600
    max_tokens: 1024
  gemini:
    # Google AI Studio free tier; quotas are per model, so the fallbacks are real extra budget.
    model: gemini-3.8-flash
    fallback_models: [gemini-3.5-flash, gemini-2.5-flash, gemini-flash-lite-latest]
    cooldown_seconds: 900
    max_tokens: 1024
  ollama:
    model: llama3.1
    host: http://localhost:11434
    timeout: 120
  anthropic:
    model: claude-opus-5
    max_tokens: 2048
    effort: medium                        # low | medium | high | xhigh | max
    server_fallbacks: true                # let Anthropic re-route a refused request to a fallback model
  openai:
    model: gpt-4o-mini
    base_url: null                        # e.g. http://localhost:1234/v1 for LM Studio (no key needed)
    api_key_env: OPENAI_API_KEY
    max_tokens: 2048

news:
  # All free: yfinance headlines (no key), Google News RSS (no key), local CSVs, GDELT (no key).
  # `stockbot news-history` builds the training history in local_csv_dir from Google News RSS
  # (date-range search, 2015+) or GDELT (--source gdelt, 2017+, heavily throttled per IP).
  sources: [yfinance, google_rss, local_csv]
  local_csv_dir: data/news
  cache_dir: data/news_cache
  max_age_hours: 12
  gdelt_sleep: 6.0          # GDELT allows one request every 5 seconds
  company_names:            # better GDELT queries than raw tickers (others fall back to yfinance's short name)
    SPY: "Wall Street"
    QQQ: Nasdaq
    AAPL: Apple
    MSFT: Microsoft
    NVDA: Nvidia
    AMZN: Amazon
    GOOGL: Alphabet
    META: Meta Platforms
    JPM: JPMorgan
    XOM: ExxonMobil
    JNJ: "Johnson & Johnson"
    UNH: UnitedHealth
    COST: Costco
    BRK-B: "Berkshire Hathaway"
    V: Visa
    RY.TO: "Royal Bank of Canada"
    TD.TO: "TD Bank"
    SHOP.TO: Shopify
    ENB.TO: Enbridge
    CNQ.TO: "Canadian Natural Resources"
    CP.TO: "CPKC railway"
    CNR.TO: "CN Rail"
    BMO.TO: "Bank of Montreal"
    BNS.TO: Scotiabank
    SU.TO: Suncor
    ATD.TO: "Alimentation Couche-Tard"
    MFC.TO: Manulife
