execution:
  # paper  = built-in simulator broker (free, unlimited, no account)
  # alpaca = Alpaca account (paper or real, alpaca-py, ALPACA_API_KEY / ALPACA_SECRET_KEY)
  # moomoo = moomoo / Futu OpenAPI through the OpenD gateway (paper "simulate" account or real)
  mode: paper
  state_file: data/paper/state.json
  # Markets that the main broker cannot trade go to their own sleeve: Alpaca is US-only, so the
  # Canadian names (.TO) paper-trade on the built-in simulator (moomoo Canada fees, CAD) until the
  # moomoo OpenD gateway is set up.  Each sleeve has its own equity; exposure caps apply per sleeve.
  routes: { ca: paper }       # paper phase only: Alpaca cannot trade the TSX (see alpaca.proxies); live on moomoo Canada one account
                              # trades both markets (moomoo.market: ALL) and no sleeve is used
  sleeves:
    ca: { state_file: data/paper/state_ca.json, initial_cash: 100000 }
  max_gross_exposure: 1.0     # sum of |weights| per sleeve
  max_position: 0.10          # capital slice per ticker (fraction of equity); 30 names x 10% = fully invested at most
  min_trade_usd: 50
  max_names: 0                # >0: hold at most this many names (a small account; held names keep their slot unless they fall
  max_names_hysteresis: 3     # more than this many places below the cut)
  cadence: daily              # daily | weekly (rebalance on the first session of the week only)
  whole_shares: false         # true = never a fractional share (implied for Alpaca when alpaca.fractional is false)
  # The decision layer (execution/ranking.py, chosen on the 2026-09-15 diagnosis: the policy alone tracks buy-and-hold, the
  # ranking head has stable alpha): hold the top_k names by a blend of cross-sectional percentile ranks, rebalance every
  # every_bars trading days, keep a held name until it drops hysteresis places below the cut; the policy sizes each slot
  # (policy_floor .. 1 of 1/top_k) and can veto a name (policy_veto).  Backtest: `stockbot backtest`.
  rank:
    enabled: true
    # 2012-2026 on the point-in-time universe, phase-averaged, compounded growth a year: rebalancing every 1 bar earns +8.0%,
    # every 3 +15.1%, every 5 +16.4%, every 10 +18.2%, every 15 +19.3%, every 21 +19.1%, every 63 +18.9% - so trading faster than
    # every two weeks destroys return through fees and whipsaw, and past three weeks nothing more is gained.  Hysteresis matters
    # more than the cadence (+0.8 pt/yr from 3 to 10) and concentration more than either (top-20 +20.5% vs top-25 +19.1%)
    top_k: 20
    every_bars: 15            # 1 daily, 5 weekly, 15 every three weeks, 21 monthly - the fee per round trip decides
    hysteresis: 10            # a held name keeps its slot while it ranks within top_k + 10: fewer round trips on score noise
    inputs: { xs_rank.xs_score: 1.0, timesfm.tfm_ret_20: 0.5 }
    policy_floor: 1.0         # slots always full: the reflection's regret is dominated by under-sized positions and the per-name
                              # policy's own out-of-sample record is below buy-and-hold, so it keeps only its veto (policy_veto)
    policy_veto: 0.05
    adaptive: true            # use the weekend-tuned blend (models/rank_weights.json: trailing-IC weights that backtested no worse)
    # risk controls, measured on the 100-name point-in-time data (2012-2026, phase-averaged, top-25): the sector cap cost 0.6 pt/yr of
    # compounded growth and reduced no drawdown -> off; volatility targeting cost 0.5 pt/yr (19.0% -> 18.5% a year) and cut the worst
    # drawdown from -39% to -25% -> kept as cheap insurance for a book meant to compound for decades (set enabled: false to run it plain)
    max_per_sector: 0         # at most this many of the top_k from one Yahoo sector (models/sectors.json, refreshed weekly); 0 = no cap
    # the opportunistic layer between rebalance days: a name whose score reaches the enter_pct percentile comes in (a free slot,
    # else replacing the weakest holding), a holding under exit_pct leaves, at most max_swaps changes a day.  Off: 2012-2026 it
    # added +0.2 pt/yr to the main book (9/15 years, a coin flip) and cost the small book 2-25 pt/yr in turnover; the weekend
    # structure tuner keeps testing it and switches it on only after two consecutive winning weeks
    deals: { enabled: false, enter_pct: 0.98, exit_pct: 0.0, max_swaps: 1, min_gap: 0.0 }
    # between rebalance days the backtested rule holds full slots, but a live book drifts below them (a conviction-scaled entry,
    # an intraday exit, a cut-to-cash order), and that cash then sits idle until the next rebalance.  This buys held names back
    # up to their slot - never sells on drift - when real money is idle above the reserve
    top_up: { enabled: true, min_cash: 0.02, band: 0.15, max_names: 5 }
    portfolio_rl: { enabled: true }   # the portfolio agent (stockbot portfolio-rl: PPO over rebalance timing + exposure, walk-forward vs this
                                      # rule) takes over the cadence and the volatility targeting only once its report says accepted
    vol_target:               # volatility targeting on the whole book (Moreira & Muir 2017): gross exposure is scaled so the book's
      enabled: true           # recent realised volatility meets `target` (annualised); never above 1x, never below `floor`
      target: 0.25
      window: 10
      floor: 0.4
    trend_filter:             # Faber (2007): the rank slots go to cash while the benchmark closes below its moving average
      enabled: false          # (a band either side avoids whipsaw); on for the small account, off here - see accounts.small
      benchmark: SPY
      sma: 200
      band: 0.02
  core:                       # the index sleeve inside the account, timed by the model: every every_bars its conviction on the
    ticker: SPY               # core name places the weight between min_share (trimmed - sell high, cash kept) and max_share
    share: 0.0                # (bought back - buy low with the proceeds); moved only when the change clears band.  The rank
    decide: model             # slots share what is left minus the cash reserve.  0 = no core (the $100k account); the $10k
    min_share: 0.25           # account uses 0.5.  decide: hold = bought once, topped up, never sold.  Never sold intraday.
    max_share: 0.5
    every_bars: 21
    band: 0.05
  # Buys are planned against the sleeve's OWN cash (Alpaca `cash`, moomoo `cash`; never margin buying power)
  # and never spend more than (1 - cash_reserve) of it: a 10% buffer for fees, price moves before the fill and
  # the odd rejected sell.  Sale proceeds are not reused in the same cycle (T+1 settlement in a cash account).
  cash_reserve: 0.10          # buys use own cash only (never margin) and always leave this share of the sleeve's equity in cash
  # execution timing (60 days of 15-minute bars, 120 names, Sep 2026): from the 10:00 price the average move is -1.9 bps by
  # 13:30 and -5.2 bps by the close, and returns accrue overnight (Lou, Polk and Skouras 2019) - so sells go at the decision
  # cycle and buys wait for buy_at (ET), a few minutes before the job's window ends at the latest.  A resting buy limit
  # 0.3% under the 10:00 price fills on 74% of days but the days it misses cost as much as it saves (mean 0 bps, median
  # -30): buy_limit_discount stays 0 unless you want that lottery; > 0 places the limit at the cycle and sends whatever is
  # unfilled at market at buy_at
  buy_at: "13:15"
  buy_limit_discount: 0.0
  # Real brokers (alpaca / moomoo / live) only get orders while the exchange is open, so every fill
  # happens at a live price and the move after it can be watched.  `stockbot trade --allow-closed`
  # overrides this once; the built-in paper simulator is not affected.
  require_market_open: true
  alpaca:
    paper: true               # true = Alpaca's free paper-trading account (web dashboard included)
    fractional: false         # moomoo Canada trades whole shares only: both paper accounts follow that (whole-share orders)
    keys_env: ALPACA          # <keys_env>_API_KEY / <keys_env>_SECRET_KEY hold the keys (another account: ALPACA_10K)
    # Alpaca cannot trade the TSX, so the Canadian names are paper-traded through the same companies' US listings (real fills,
    # one real account) while the universe, the data and the live moomoo line keep the .TO ticker; a name without a US
    # listing (ATD.TO) stays on the built-in simulator.  moomoo Canada's fee schedule is still what gets booked for them.
    proxies: { RY.TO: RY, TD.TO: TD, SHOP.TO: SHOP, ENB.TO: ENB, CNQ.TO: CNQ, CP.TO: CP, CNR.TO: CNI, BMO.TO: BMO, BNS.TO: BNS, SU.TO: SU, MFC.TO: MFC }
  moomoo:
    env: simulate             # simulate (paper account) | real (needs MOOMOO_TRADE_PASSWORD + --i-understand-real-money)
    host: 127.0.0.1           # OpenD gateway
    port: 11111
    security_firm: FUTUCA     # FUTUCA (moomoo Canada) | FUTUINC (moomoo US) | FUTUSECURITIES (HK) | FUTUSG | FUTUAU | FUTUJP | FUTUMY
    market: ALL               # ALL = every market the account may trade (US + CA on moomoo Canada: US.AAPL, CA.RY); or one of US / CA
    allow_short: false

feedback:
  experience_file: data/experience/trades.jsonl
  direction_file: data/experience/direction.jsonl   # per-model up/down votes and how they turned out (`stockbot forecast`)
  review_dir: data/experience/reviews               # post-trade reviews (`stockbot review`): day / week / month / year replays + lessons
  review_benchmark: SPY
  what_if:                      # the day review's parallel search over the moves that were available (exposure level x entry x exit)
    levels: [0.0, 0.25, 0.5, 0.75, 1.0]
    workers: 4
  hindsight:                    # learn from the paper trades (`stockbot review --learn`), one finished unit at a time: yesterday
    enabled: true               # (every morning), last week (weekend), last month, last year - each labelled by the fee-aware best
                                # path over THAT unit (the best day play is not the best week play); a member's update is kept only
                                # if its out-of-sample score holds
    min_samples: 40             # labelled decisions in the unit needed before touching the policy
    epochs: 8
    lr: 0.00005
    batch_size: 256
    anchor_weight: 1.0          # hold the policy's answers on simulator states (no forgetting what the simulations taught)
    ref_steps: 2048             # how many simulator states form that anchor
    guard: true                 # re-score each member on the held-out window; keep the update only if the score holds
    max_score_drop: 0.02
    eval_tickers: 8             # the quick yardstick (short budgets)
    eval_bars: 500
    big_budget_minutes: 20      # with at least this much time (the morning run) use the trainer's full yardstick and more epochs
    eval_tickers_full: 12
    eval_bars_full: 750
    epochs_full: 16

session:                      # `stockbot session`: the daily market-hours run (also what the GitHub workflow does)
  hours: 4                    # trade at the open, then watch the positions for this long
  after_open_minutes: 5       # let the opening auction settle before sending orders
  max_wait_minutes: 80        # started before the open: wait at most this long for it
  snapshot_minutes: 15        # log prices / equity / move-since-open this often
  end_margin_minutes: 15      # the background trainer must finish this long before the session ends
  deadline_minutes: 0         # 0 = no job deadline; the GitHub workflow passes ~300 so watch + review + trainer end before the 6 h kill
  deadline_at: ""             # or an absolute ISO time (the workflow anchors it on the job's start: JOB_DEADLINE); the earlier one wins
  review_after: true          # after the watch window, replay the day and score it against the alternatives (`stockbot review`)
  learn_before_open: true     # before the open, learn from yesterday (and any finished week / month / year not learned yet) in a
  learn_margin_minutes: 8     # background process alongside the agent warm-up; it must be done this many minutes before the open
  accounts: true              # also trade every enabled account under `accounts:` from the same signals, each with its own rules
  intraday_exit:              # during the watch window, sell a held name when the exit model - fitted on the broker's 15-minute
    enabled: true             # bars by `stockbot intraday-fit` - says the close will most likely be lower than where we can sell now
    min_prob: 0.6             # ("up 1% at 11:00, gave it all back by 14:00"); confidence needed ...
    min_gain: 0.005           # ... and a move worth acting on: take a profit of at least this since the open ...
    stop_loss: 0.02           # ... or cut a loss past this
    min_auc: 0.55             # the model is only acted on when it proved itself on its held-out days: this much discrimination ...
    min_edge: 0.0005          # ... and the moments it flagged were better sold than held by at least this (else it stays OFF)
    same_day: true            # may a name bought at the open be sold the same day? (false for a cash account / day-trade rules)
    model_dir: models/intraday_exit
  train: true                 # keep training the policy in the background while the market is watched
  train_minutes: 0            # 0 = whatever is left of the session after the margin
  train_timesteps: 2000000    # PPO steps per ensemble member per session (the time budget usually wins)
  train_n_envs: 3             # parallel simulators (the runner has 4 cores, one stays free for the trading loop)
  train_seeds: null           # null = train.seeds
  reuse_dataset_days: 7       # reuse models/dataset when younger than this: the weekly retrain refits every
                              # third-party sub-model, the daily session spends its time on the policy
  log_dir: data/paper/sessions

autopilot:                    # `stockbot autopilot`: trade every weekday, retrain monthly
  trade_time: "16:30"         # exchange time, after the close
  timezone: America/New_York
  retrain_every_days: 30
  retrain_timesteps: 100000
  initial_timesteps: 300000   # used only when no policy exists yet
  report: true
  state_file: data/autopilot.json

report:
  out: reports/dashboard.html

accounts:                     # extra accounts traded in the SAME session from the same signals, each with its own rules, state,
  small:                      # experience and reviews (`--account small` on the CLI); skipped automatically while its keys are missing.
    enabled: true             # Keys: <keys_env>_API_KEY / <keys_env>_SECRET_KEY.  Both books teach the one policy (fee_drag tells it which).
    execution:
      mode: alpaca
      alpaca: { paper: true, fractional: false, keys_env: ALPACA_10K, history_dir: data/paper/small/alpaca }   # moomoo Canada: whole shares
      state_file: data/paper/small/state.json
      sleeves: { ca: { state_file: data/paper/small/state_ca.json, initial_cash: 10000 } }
      # the small profile (grid on the cached dataset, 2026-09-15): the top 5 names rebalanced monthly, slots full or empty,
      # $800 minimum orders.  Phase-averaged over start dates: OOS year ~+20% (SPY +20%, range -3..+44%), 3y ~+89% (SPY +76%),
      # ~12 turnovers a year at ~22 bps.  SPY is a regular stock here: it competes for slots like any other name, no index sleeve.
      # The weekend tuner (`stockbot portfolio --tune`) re-decides slots, cadence and hysteresis, keeping a change only if it
      # is at least as good over the last year and the last three years.
      core: { ticker: SPY, share: 0.0 }
      max_position: 0.20      # a rank slot = (1 - 0.1 reserve) / 5 = 18% of the book, $1,800 on $10k
      # (the 200-day trend filter is OFF: year by year 2021-2026 it lost 8-11 points in every year it triggered, incl. 2022
      #  where the rule alone lost 4% against SPY's 18% - the ranking sidesteps bad markets by what it selects)
      # the aggressive book, run plain by the owner's choice: on the 100-name record the sector cap cost 2.4 pt/yr of compounded growth
      # for no drawdown benefit and volatility targeting 1.7 pt/yr (28.5% -> 26.8% a year) for a worst drawdown of -30% instead of -41%
      # monthly is clearly right for a 5-name book at $1.99 an order (+28.1% a year vs +23.1% every 10 bars and +18.0% every 5);
      # hysteresis 8 adds +0.8 pt/yr over 3
      rank: { top_k: 5, every_bars: 21, hysteresis: 8, policy_floor: 1.0, trend_filter: { enabled: false }, max_per_sector: 0,
              vol_target: { enabled: false, target: 0.30, window: 20, floor: 0.4 } }
      min_trade_usd: 800      # never an order the US$1.99 minimum would make expensive
      cadence: daily          # (the rank layer's every_bars sets the cadence)
      cash_reserve: 0.10
    env: { initial_cash: 10000 }
    feedback: { experience_file: data/experience/small/trades.jsonl, direction_file: data/experience/small/direction.jsonl,
                review_dir: data/experience/small/reviews }
    session: { log_dir: data/paper/sessions/small, intraday_exit: { same_day: false } }   # no same-day round trips in a small account
    report: { out: reports/dashboard_small.html }
