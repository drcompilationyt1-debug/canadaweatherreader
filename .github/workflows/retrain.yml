name: retrain

# Weekend jobs while the market is closed (one run per day, under the 6 h limit):
#   Saturday  - refresh data + news history, refit every third-party / sub-model (candlestick
#               statistics, factor model, GRU forecaster, ES / DQN agents, Keras models, qlib
#               LightGBM), then continue training the policy on the parallel simulators.
#   Sunday    - reuse Saturday's dataset and give the policy another full day of simulation.
# Both end by saving models / experience / dashboard to the `state` branch.
on:
  schedule:
    - cron: "0 6 * * 6"          # Saturday 06:00 UTC
    - cron: "0 6 * * 0"          # Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      timesteps:
        description: "PPO steps per ensemble member (about 100k steps per 1.5 minutes on a runner)"
        default: "4000000"
      seeds:
        description: "ensemble members"
        default: "3"
      refit:
        description: "refit the third-party sub-models (Saturday behaviour); off = policy only on the cached dataset"
        type: boolean
        default: true
      from_scratch:
        description: "ignore the current policy and train fresh"
        type: boolean
        default: false

concurrency:
  group: stockbot-state
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # GitHub's hard limit is 360
    permissions:
      contents: write
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}
      FINANCIAL_DATASETS_API_KEYS: ${{ secrets.FINANCIAL_DATASETS_API_KEYS }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
    steps:
      - name: which day
        id: day
        run: |
          dow=$(date -u +%u)   # 6 = Saturday, 7 = Sunday
          refit=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then refit="${{ inputs.refit }}"; elif [ "$dow" = "6" ]; then refit=true; fi
          echo "dow=$dow" >> "$GITHUB_OUTPUT"
          echo "refit=$refit" >> "$GITHUB_OUTPUT"
          echo "day $dow, refit third-party sub-models: $refit"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: third-party code the signals need
        run: |
          git submodule update --init --depth 1 third_party/automating-technical-analysis
          git submodule update --init --depth 1 third_party/trendet || true
          git submodule update --init --depth 1 third_party/Kronos || echo "Kronos clone failed - block stays masked"
          git submodule update --init --depth 1 third_party/WorldQuant_alpha101_code || echo "alpha101 clone failed - block stays masked"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[all]" tzdata alpaca-py
          pip install technical || echo "technical (freqtrade qtpylib) unavailable - that block stays masked"
      - name: foundation models + extra indicator libraries (Chronos, TimesFM, FinBERT, pandas-ta, PyPortfolioOpt, Kronos deps)
        run: |
          pip install chronos-forecasting pandas-ta-classic PyPortfolioOpt transformers einops safetensors huggingface_hub quantstats pyfolio-reloaded || echo "some model libraries failed - those blocks stay masked"
          pip install "timesfm[torch]" || echo "timesfm unavailable - block stays masked"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('config/default.yaml') }}
          restore-keys: hf-models-${{ runner.os }}-
      - name: TA-Lib (61 candlestick recognisers)
        run: |
          curl -sSL -o /tmp/ta-lib.deb https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib_0.6.4_amd64.deb \
            && sudo dpkg -i /tmp/ta-lib.deb && pip install TA-Lib || echo "TA-Lib unavailable - talib_candles stays masked"
      - uses: actions/cache@v4
        with:
          path: .venv-tf
          key: tf-env-${{ runner.os }}-${{ hashFiles('scripts/setup_agent_envs.py') }}
      - name: TensorFlow env for the Keras models
        run: python scripts/setup_agent_envs.py --only tf
      - name: restore state
        run: python scripts/ci_state.py restore
      - name: doctor
        run: python -m stockbot doctor
      - name: post-trade reviews (week after every trading week, month / year once they end)
        run: python -m stockbot review --due || true
      - name: intraday exit model (refit on 120 days of the broker's bars, Saturday)
        if: ${{ steps.day.outputs.refit == 'true' }}
        run: timeout 10m python -m stockbot intraday-fit --days 120 --holdout-days 10 || true
      - name: news history (incremental, Saturday)
        if: ${{ steps.day.outputs.refit == 'true' }}
        run: timeout 35m python -m stockbot news-history --start 2018-01-01 || echo "news history partial - resumes next time"
      - name: qlib model (bundle from our own Yahoo cache -> Alpha158 -> LightGBM, Saturday)
        if: ${{ steps.day.outputs.refit == 'true' }}
        run: |
          git submodule update --init --depth 1 third_party/qlib \
            && pip install pyqlib lightgbm \
            && timeout 20m python scripts/qlib_build_bundle.py --refresh \
            && timeout 30m python scripts/qlib_train.py \
            || echo "qlib unavailable this week - the qlib block keeps last week's predictions or stays masked"
      - name: retrain
        run: >
          python -m stockbot retrain
          --timesteps ${{ inputs.timesteps || '4000000' }}
          --seeds ${{ inputs.seeds || '3' }}
          --n-envs 4
          --max-minutes 220
          ${{ steps.day.outputs.refit == 'true' && '' || '--reuse-dataset-days 3' }}
          ${{ inputs.from_scratch == true && '--from-scratch' || '' }}
      - name: evaluate
        run: python -m stockbot evaluate --plot eval.png
      - name: learn from last week / month / year as one unit each (hindsight fine-tune, guarded by the out-of-sample score)
        run: timeout 25m python -m stockbot review --learn --due --max-minutes 20 || true
      - name: forecast scorecard
        run: python -m stockbot forecast --no-refresh || true
      - name: save state
        if: always()
        run: python scripts/ci_state.py save
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ github.run_number }}
          path: |
            eval.png
            models/policy/ensemble.json
            models/policy/best.json
            reports/dashboard.html
            data/experience/reviews/*.json
            data/experience/reviews/*.html
          if-no-files-found: ignore
