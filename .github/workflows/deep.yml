name: deep

# Saturday after the weekend job: the heavy ranking heads (neural ensemble, TabPFN) are trained on a free Kaggle GPU from the
# saved dataset, then saved to the `state` branch; every runner reuses them for daily scoring (signals.<head>.pretrained).
on:
  schedule:
    - cron: "30 12 * * 6"        # Saturday 12:30 UTC, after the retrain job
  workflow_dispatch:
    inputs:
      slug:
        description: "Kaggle kernel name"
        default: "cwr-trainer"
      cmd:
        description: "command to run on the GPU"
        default: "python -m stockbot gpu-train --ic-start 2019-01-01"
      collect:
        description: "comma-separated globs (relative to the repo) to bring back and save to the state branch"
        default: "models/signals/xs_nn.joblib,models/signals/xs_nn_preds.parquet,models/signals/xs_tabpfn.joblib,models/signals/xs_tabpfn_preds.parquet"

concurrency:
  group: stockbot-state
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TABPFN_TOKEN: ${{ secrets.TABPFN_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: kaggle client
        run: pip install -q kaggle
      - name: train on the Kaggle GPU (push the kernel, wait, download)
        id: kaggle
        run: >
          python scripts/kaggle_deep.py run --out kaggle_out --max-minutes 300
          --slug "${{ inputs.slug || 'cwr-trainer' }}"
          --cmd "${{ inputs.cmd || 'python -m stockbot gpu-train --ic-start 2019-01-01' }}"
          --collect "${{ inputs.collect || 'models/signals/xs_nn.joblib,models/signals/xs_nn_preds.parquet,models/signals/xs_tabpfn.joblib,models/signals/xs_tabpfn_preds.parquet' }}"
      - name: save the trained heads to the state branch
        if: ${{ steps.kaggle.outcome == 'success' }}
        run: |
          python scripts/ci_state.py restore
          src=$(find kaggle_out -type d -path '*out/models' | head -1)
          if [ -n "$src" ]; then cp -r "$src"/. models/; echo "updated $(find "$src" -type f | wc -l) files under models/"; fi
          python scripts/ci_state.py save
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-${{ github.run_number }}
          path: kaggle_out/**/report.json
          if-no-files-found: ignore
