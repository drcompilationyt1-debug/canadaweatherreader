name: session

# Every weekday: start about 75 minutes before the New York open, learn from yesterday's paper
# trades (hindsight fine-tune on that day as one unit) while the LLM agents warm up, trade at the
# open, watch the positions for four hours and keep training the policy on the simulators
# in the background; then review the day and save the models / experience / dashboard to the
# `state` branch.  Every deadline is anchored on the job's start (JOB_DEADLINE) so the whole run
# ends before GitHub's 6 h kill no matter how long the early steps take.  Two cron slots cover
# daylight-saving and standard time; `--gate-minutes` lets only the one near the open run.
on:
  schedule:
    - cron: "15 12 * * 1-5"      # 08:15 New York while daylight-saving time is in force (Mar-Nov)
    # - cron: "15 13 * * 1-5"      # 08:15 New York in standard time (Nov-Mar)
  workflow_dispatch:
    inputs:
      mode:
        description: "alpaca (paper account) | paper (built-in simulator, no keys needed)"
        default: "alpaca"
      hours:
        description: "session length after the open"
        default: "4"
      dry_run:
        description: "decide and watch, send nothing"
        type: boolean
        default: false
      train:
        description: "train in the background during the session"
        type: boolean
        default: true
      gate:
        description: "only run near the open (uncheck to run a session right now, waiting for the open if needed)"
        type: boolean
        default: false

concurrency:
  group: stockbot-state
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 355         # GitHub kills the job at 360: JOB_DEADLINE (minute 325) ends the session; review + save follow
    permissions:
      contents: write
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}
      FINANCIAL_DATASETS_API_KEYS: ${{ secrets.FINANCIAL_DATASETS_API_KEYS }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "3"
      TZ: America/New_York
    steps:
      - name: session slot?
        id: gate
        if: ${{ github.event_name == 'schedule' || inputs.gate == true }}
        run: |
          # cheap pre-install check: proceed only between 07:55 and 10:00 New York on a weekday
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          ok = now.weekday() < 5 and (7, 55) <= (now.hour, now.minute) <= (10, 0)
          print(f"proceed={'true' if ok else 'false'}")
          print(f"now={now:%a %Y-%m-%d %H:%M %Z}")
          EOF
          cat "$GITHUB_OUTPUT"
      - name: job clock (everything below plans around this deadline, 325 min after the job started)
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: |
          echo "JOB_DEADLINE=$(date -u -d '+325 minutes' +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
          echo "job started $(date -u +%H:%M) UTC, deadline $(date -u -d '+325 minutes' +%H:%M) UTC"
      - uses: actions/checkout@v4
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        with:
          fetch-depth: 1
          submodules: false
      - name: third-party code the signals need
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: |
          git submodule update --init --depth 1 third_party/automating-technical-analysis
          git submodule update --init --depth 1 third_party/TradingAgents || echo "TradingAgents clone failed - block stays masked"
          git submodule update --init --depth 1 third_party/ai-hedge-fund || echo "ai-hedge-fund clone failed - block stays masked"
          git submodule update --init --depth 1 third_party/Kronos || echo "Kronos clone failed - block stays masked"
          git submodule update --init --depth 1 third_party/WorldQuant_alpha101_code || echo "alpha101 clone failed - block stays masked"
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: |
          python -m pip install -U pip
          pip install -e ".[all]" tzdata alpaca-py
          pip install technical || echo "technical (freqtrade qtpylib) unavailable - that block stays masked"
      - name: foundation models + extra indicator libraries (Chronos, TimesFM, FinBERT, pandas-ta, PyPortfolioOpt, Kronos deps)
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: |
          pip install chronos-forecasting pandas-ta-classic PyPortfolioOpt transformers einops safetensors huggingface_hub quantstats pyfolio-reloaded || echo "some model libraries failed - those blocks stay masked"
          pip install "timesfm[torch]" || echo "timesfm unavailable - block stays masked"
      - uses: actions/cache@v4
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('config/default.yaml') }}
          restore-keys: hf-models-${{ runner.os }}-
      - name: TA-Lib (61 candlestick recognisers)
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: |
          curl -sSL -o /tmp/ta-lib.deb https://github.com/ta-lib/ta-lib/releases/download/v0.6.4/ta-lib_0.6.4_amd64.deb \
            && sudo dpkg -i /tmp/ta-lib.deb && pip install TA-Lib || echo "TA-Lib unavailable - talib_candles stays masked"
      - uses: actions/cache@v4
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        with:
          path: .venv-tf
          key: tf-env-${{ runner.os }}-${{ hashFiles('scripts/setup_agent_envs.py') }}
      - name: TensorFlow env for the Keras models
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: python scripts/setup_agent_envs.py --only tf
      - uses: actions/cache@v4
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        with:
          path: |
            .venv-tradingagents
            .venv-aihf
          key: agent-envs-${{ runner.os }}-${{ hashFiles('scripts/setup_agent_envs.py', '.gitmodules') }}
      - name: LLM agent frameworks (TradingAgents, ai-hedge-fund) in their own envs
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: |
          python scripts/setup_agent_envs.py --only tradingagents || echo "TradingAgents env failed - block stays masked"
          python scripts/setup_agent_envs.py --only aihf || echo "ai-hedge-fund env failed - block stays masked"
      - name: restore state
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: python scripts/ci_state.py restore
      - name: doctor (which inputs are live on this runner)
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: python -m stockbot doctor
      - name: llm smoke (one headline score through the key pools)
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: python -m stockbot news --ticker SPY --days 1 --no-cache | tail -12 || true
      - name: market status
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: python -m stockbot market-status
      # (the session itself learns from yesterday - and any finished week / month / year not learned yet - in a background
      #  process while the LLM agents warm up before the open: session.learn_before_open)
      - name: session
        if: ${{ steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true' }}
        run: >
          timeout 320m python -m stockbot session --mode ${{ inputs.mode || 'alpaca' }} --deadline-minutes 300 --deadline-at "$JOB_DEADLINE"
          --hours ${{ inputs.hours || '4' }}
          ${{ (github.event_name == 'schedule' || inputs.gate == true) && '--gate-minutes 90' || '' }}
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ${{ inputs.train == false && '--no-train' || '' }}
      - name: daily review (what we did vs the alternatives, every move that was available, where the regret came from)
        if: ${{ always() && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true') }}
        run: python -m stockbot review --period day || true
      - name: learn any finished unit the morning could not (fallback; usually a quick skip - today's close is not in yet)
        if: ${{ always() && !(inputs.dry_run == true) && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true') }}
        run: timeout 10m python -m stockbot review --learn --due --max-minutes 8 --offline || true
      - name: forecast scorecard
        if: ${{ always() && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true') }}
        run: python -m stockbot forecast --no-refresh || true
      - name: experience
        if: ${{ always() && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true') }}
        run: python -m stockbot experience || true
      - name: save state
        if: ${{ always() && !(inputs.dry_run == true) && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true') }}
        run: python scripts/ci_state.py save
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (steps.gate.outcome == 'skipped' || steps.gate.outputs.proceed == 'true') }}
        with:
          name: session-${{ github.run_number }}
          path: |
            reports/dashboard.html
            data/paper/sessions/session_*.json
            data/paper/sessions/session_*.jsonl
            data/experience/reviews/day_*.json
          if-no-files-found: ignore
