name: clock

# GitHub starts scheduled runs late - by Oct 2026 often 4-6 hours (an 08:15 slot started at 13:11) - but a run started by another
# workflow starts at once.  So this job keeps time itself: it sleeps until the next weekday 08:15 New York (at most ~5.6 h per job),
# then starts the session, and always hands over to a fresh copy of itself.  The cron below only restarts the chain if it breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 */4 * * *"

concurrency:
  group: stockbot-clock
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: sleep until the session is due, then start it
        run: |
          python3 - <<'EOF'
          import subprocess, time, urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          NY = ZoneInfo("America/New_York")
          REPO = "${{ github.repository }}"
          started = time.time()
          budget = 335 * 60                                    # leave time to hand over before the job's limit

          def traded_today(now):
              url = f"https://raw.githubusercontent.com/{REPO}/state/data/paper/sessions/session_{now:%Y-%m-%d}.json"
              try:
                  return urllib.request.urlopen(urllib.request.Request(url, method="HEAD"), timeout=20).status == 200
              except Exception:
                  return False

          def due(now):
              """A weekday from 08:15 until the close, and no session yet today."""
              return now.weekday() < 5 and (8, 15) <= (now.hour, now.minute) < (16, 0) and not traded_today(now)

          def next_slot(now):
              d = now.replace(hour=8, minute=15, second=0, microsecond=0)
              if now >= d:
                  d += timedelta(days=1)
              while d.weekday() >= 5:
                  d += timedelta(days=1)
              return d

          def running_session():
              out = subprocess.run(["gh", "run", "list", "-R", REPO, "--workflow", "session.yml", "--json", "status", "--limit", "5"],
                                   capture_output=True, text=True).stdout
              return '"in_progress"' in out or '"queued"' in out or '"pending"' in out

          while True:
              now = datetime.now(NY)
              if due(now):
                  if running_session():
                      print(f"{now:%a %H:%M} a session is already running")
                  else:
                      print(f"{now:%a %H:%M} starting the session")
                      subprocess.run(["gh", "workflow", "run", "session.yml", "-R", REPO, "--ref", "main", "-f", "gate=true"], check=False)
              # today is handled (started, running, done, or not a trading day): wait for the next weekday 08:15
              now = datetime.now(NY)
              wait = (next_slot(now) - now).total_seconds()
              left = budget - (time.time() - started)
              if wait > left:
                  print(f"{now:%a %H:%M} next session {next_slot(now):%a %H:%M}: sleeping {left / 60:.0f} min, then handing over")
                  time.sleep(max(0, left))
                  break
              print(f"{now:%a %H:%M} sleeping {wait / 60:.0f} min until {next_slot(now):%a %H:%M}")
              time.sleep(max(1, wait))
          EOF
      - name: hand over to a fresh clock
        if: always()
        run: gh workflow run clock.yml -R "${{ github.repository }}" --ref main
